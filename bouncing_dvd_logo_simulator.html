<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD Screensaver</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Righteous&display=swap');

        /* Reset margins and ensure the body takes up the exact viewport size */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000; /* Pitch black */
            overflow: hidden; /* Hide scrollbars absolutely */
            font-family: 'Righteous', sans-serif;
        }

        #logo {
            position: absolute;
            width: 180px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            top: 0;
            left: 0;
            user-select: none; /* Prevent text highlighting */
        }

        .dvd-text {
            font-size: 60px;
            font-weight: bold;
            line-height: 1;
            z-index: 2;
            position: relative;
        }

        .dvd-ellipse {
            position: absolute;
            width: 110%;
            height: 65%;
            border: 6px solid currentColor;
            border-radius: 50%;
            bottom: 6px;
            z-index: 1;
            transform: skewX(-15deg);
        }

        #fx {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        #flash {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            z-index: 998;
            transition: opacity 0.5s ease-out;
        }

        .flash-active {
            opacity: 1 !important;
            transition: none !important;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-5px, -5px) rotate(-1deg); }
            20% { transform: translate(5px, 5px) rotate(1deg); }
            30% { transform: translate(-5px, 5px) rotate(0deg); }
            40% { transform: translate(5px, -5px) rotate(1deg); }
            50% { transform: translate(-5px, 0px) rotate(-1deg); }
            60% { transform: translate(5px, 5px) rotate(0deg); }
            70% { transform: translate(-5px, -5px) rotate(1deg); }
            80% { transform: translate(5px, 5px) rotate(-1deg); }
            90% { transform: translate(-5px, 5px) rotate(0deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        
        body.shake {
            animation: shake 0.5s ease-in-out;
        }

        #scoreboard {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Righteous', sans-serif;
            font-size: 20px;
            z-index: 1000;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px); /* Adds a nice frosted glass effect behind the score */
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        .score-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 5px;
        }
        
        .score-row:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div id="scoreboard">
        <div class="score-row">
            <span>Edge Hits:</span>
            <span id="edge-score">0</span>
        </div>
        <div class="score-row">
            <span>Corner Hits:</span>
            <span id="corner-score">0</span>
        </div>
    </div>
    
    <canvas id="fx"></canvas>
    <div id="flash"></div>
    <div id="logo">
        <div class="dvd-ellipse"></div>
        <div class="dvd-text">DVD</div>
    </div>

    <script>
        const logo = document.getElementById('logo');
        const fxCanvas = document.getElementById('fx');
        const ctx = fxCanvas.getContext('2d');
        const flashEl = document.getElementById('flash');
        
        const edgeScoreEl = document.getElementById('edge-score');
        const cornerScoreEl = document.getElementById('corner-score');
        
        let edgeHits = 0;
        let cornerHits = 0;
        
        // Configuration
        const baseSpeed = 7; // Increased from 4 for faster base movement
        const maxSpeed = 16; // Increased from 12 for a higher top speed
        const accel = 0.05; // Reduced from 0.3 for a much more subtle, heavy "skating" effect
        const friction = 0.98;
        
        const logoWidth = 180;
        const logoHeight = 90;
        
        // Initialize position randomly within the window
        let x = Math.random() * (window.innerWidth - logoWidth);
        let y = Math.random() * (window.innerHeight - logoHeight);
        
        // Velocity directions
        let dx = baseSpeed;
        let dy = baseSpeed;
        
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let particles = [];
        
        // Classic DVD screensaver colors
        const colors = [
            '#ff0000', // Red
            '#00ff00', // Green
            '#0000ff', // Blue
            '#ffff00', // Yellow
            '#ff00ff', // Magenta
            '#00ffff', // Cyan
            '#ffffff', // White
            '#ff8800', // Orange
            '#ff0088'  // Pink
        ];
        
        let currentColorIndex = Math.floor(Math.random() * colors.length);

        let lastTime = performance.now();

        // Function to resize canvas
        function resizeCanvas() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerEpicCornerHit(cornerX, cornerY) {
            // Flash
            flashEl.classList.add('flash-active');
            setTimeout(() => flashEl.classList.remove('flash-active'), 50);

            // Shake
            document.body.classList.remove('shake');
            void document.body.offsetWidth; // trigger reflow
            document.body.classList.add('shake');

            // Particles
            for (let i = 0; i < 200; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 15 + 5;
                particles.push({
                    x: cornerX,
                    y: cornerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    color: colors[currentColorIndex],
                    size: Math.random() * 6 + 3
                });
            }
        }

        function drawParticles(dt) {
            ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 0.2 * dt; // gravity
                p.life -= 0.015 * dt;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        // Function to change logo color upon collision
        function changeColor() {
            let newIndex = currentColorIndex;
            // Ensure the new color is different from the current one
            while (newIndex === currentColorIndex) {
                newIndex = Math.floor(Math.random() * colors.length);
            }
            currentColorIndex = newIndex;
            logo.style.color = colors[currentColorIndex];
        }

        // Set initial color
        changeColor();

        function applyFriction(velocity, hasPosInput, hasNegInput, dt) {
            let absV = Math.abs(velocity);
            let sign = Math.sign(velocity) || 1;
            
            if (!hasPosInput && !hasNegInput) {
                if (absV > baseSpeed) {
                    absV *= Math.pow(friction, dt); // Time-adjusted friction
                    if (absV < baseSpeed) absV = baseSpeed;
                } else if (absV < baseSpeed) {
                    absV += 0.1 * dt; 
                    if (absV > baseSpeed) absV = baseSpeed;
                }
            }
            return sign * absV;
        }

        // Main animation loop
        function update(currentTime) {
            if (!currentTime) currentTime = performance.now();
            
            // Normalize deltaTime so 1 unit = 1 frame at 60FPS (16.66ms)
            // Cap at 2.5 (equivalent to low frame rate) to prevent logo from glitching through walls if tab is hidden
            let dt = Math.min((currentTime - lastTime) / 16.666, 2.5);
            lastTime = currentTime;

            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            // Handle Input Acceleration (Ice Skating)
            if (keys.ArrowUp) dy -= accel * dt;
            if (keys.ArrowDown) dy += accel * dt;
            if (keys.ArrowLeft) dx -= accel * dt;
            if (keys.ArrowRight) dx += accel * dt;

            // Cap Speeds
            if (Math.abs(dx) > maxSpeed) dx = Math.sign(dx) * maxSpeed;
            if (Math.abs(dy) > maxSpeed) dy = Math.sign(dy) * maxSpeed;

            // Return to cruise speed (Ice Skating friction/normalization)
            dx = applyFriction(dx, keys.ArrowRight, keys.ArrowLeft, dt);
            dy = applyFriction(dy, keys.ArrowDown, keys.ArrowUp, dt);

            // --- SECRET CORNER MAGNET LOGIC ---
            // Calculate distance to nearest edges based on current direction
            let distX = dx > 0 ? (screenW - logoWidth) - x : x;
            let distY = dy > 0 ? (screenH - logoHeight) - y : y;
            
            // Calculate Estimated Time of Arrival (ETA in standard frames) to X and Y walls
            let tx = distX / Math.abs(dx);
            let ty = distY / Math.abs(dy);
            
            // If we are somewhat close to a corner and moving towards it
            if (tx > 5 && tx < 120 && ty > 5 && ty < 120) {
                let diff = Math.abs(tx - ty);
                // If the difference in time-to-impact is small enough, pull it in
                if (diff > 0 && diff < 30) { 
                    if (tx < ty) {
                        // X hits first, need to gently speed up Y to hit at same time
                        let targetDy = (distY / tx) * Math.sign(dy);
                        dy += (targetDy - dy) * (0.08 * dt); // Gentle pull
                    } else {
                        // Y hits first, need to gently speed up X
                        let targetDx = (distX / ty) * Math.sign(dx);
                        dx += (targetDx - dx) * (0.08 * dt); // Gentle pull
                    }
                }
            }
            // ----------------------------------

            // Calculate next theoretical position using delta time
            let nextX = x + (dx * dt);
            let nextY = y + (dy * dt);
            let hitEdgeX = false;
            let hitEdgeY = false;

            // Check horizontal boundaries
            if (nextX <= 0) {
                nextX = 0;
                dx = Math.abs(dx); // Bounce right
                hitEdgeX = true;
            } else if (nextX + logoWidth >= screenW) {
                nextX = screenW - logoWidth;
                dx = -Math.abs(dx); // Bounce left
                hitEdgeX = true;
            }

            // Check vertical boundaries
            if (nextY <= 0) {
                nextY = 0;
                dy = Math.abs(dy); // Bounce down
                hitEdgeY = true;
            } else if (nextY + logoHeight >= screenH) {
                nextY = screenH - logoHeight;
                dy = -Math.abs(dy); // Bounce up
                hitEdgeY = true;
            }

            // Process hits and epic effects
            if (hitEdgeX && hitEdgeY) {
                cornerHits++;
                cornerScoreEl.innerText = cornerHits;

                // Epic Corner Hit! Find exactly which corner we hit
                let cornerX = nextX === 0 ? 0 : screenW;
                let cornerY = nextY === 0 ? 0 : screenH;
                triggerEpicCornerHit(cornerX, cornerY);
                changeColor();
            } else if (hitEdgeX || hitEdgeY) {
                edgeHits++;
                edgeScoreEl.innerText = edgeHits;
                
                changeColor();
            }

            // Apply the final position using translate3d for hardware acceleration
            x = nextX;
            y = nextY;
            logo.style.transform = `translate3d(${x}px, ${y}px, 0)`;

            // Draw Effects
            drawParticles(dt);

            // Continue the loop
            requestAnimationFrame(update);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            
            // Keep the logo inside the screen if the window is shrunk
            if (x + logoWidth > screenW) {
                x = Math.max(0, screenW - logoWidth);
            }
            if (y + logoHeight > screenH) {
                y = Math.max(0, screenH - logoHeight);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = false;
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            // Give a momentum boost in the swiped direction (like a skate push)
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 30) {
                    dx += diffX > 0 ? 2 : -2; // Reduced touch boost
                }
            } else {
                if (Math.abs(diffY) > 30) {
                    dy += diffY > 0 ? 2 : -2; // Reduced touch boost
                }
            }
        }, { passive: true });

        // Start the animation
        requestAnimationFrame(update);
    </script>
</body>
</html>
